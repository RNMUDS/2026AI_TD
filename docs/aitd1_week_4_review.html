<script>
// Copy button for pre blocks
document.querySelectorAll('pre').forEach(function(pre) {
  var btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = 'コピー';
  btn.addEventListener('click', function() {
    // ボタン自身の文字（「コピー」）を含めないよう，ボタンを除いた複製から本文を取る
    var clone = pre.cloneNode(true);
    clone.querySelectorAll('.copy-btn').forEach(function(b) { b.remove(); });
    var code = clone.textContent.replace(/^(Python|JavaScript|HTML|Bash|JSON|Terminal|Directory Tree|\.zshrc|Notion テンプレート)( ── [^\n]+)?\n/, '');
    navigator.clipboard.writeText(code).then(function() {
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = 'コピー';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
  pre.appendChild(btn);
});

// Click-to-copy on inline code elements
document.querySelectorAll(':not(pre) > code').forEach(function(code) {
  code.title = 'クリックでコピー';
  code.addEventListener('click', function() {
    navigator.clipboard.writeText(code.textContent).then(function() {
      code.classList.add('copied');
      setTimeout(function() {
        code.classList.remove('copied');
      }, 1500);
    });
  });
});
// パスワードつきの答え合わせ：入力したパスワードで復号して表示する（本文は暗号化してページに埋め込んである）
document.querySelectorAll('.locked-answer').forEach(function(box) {
  var form = box.querySelector('.unlock-form');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var msg = form.querySelector('.unlock-msg');
    try {
      var raw = Uint8Array.from(atob(box.dataset.enc), function(c) { return c.charCodeAt(0); });
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(form.querySelector('input').value.trim()), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 200000, hash: 'SHA-256'},
                                              base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(16, 28)}, key, raw.slice(28));
      box.innerHTML = new TextDecoder().decode(plain);
    } catch (err) {
      msg.textContent = 'パスワードが違います';
    }
  });
});
</script>
