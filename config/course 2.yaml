# 授業全体の設定．未確定事項はここで差し替える（第10部）．
corpus:
  # 1. 学習コーパスの調達先．実行時点で HuggingFace Hub 上の実在を確認済み (2026-09-09)
  name: sst2
  hf_repo: stanfordnlp/sst2          # dataset repo
  hf_files:                          # train = GLUE 版 67,349 文（句レベルを含む）, validation = 872 文 → dev として使う
    train: data/train-00000-of-00001.parquet
    validation: data/validation-00000-of-00001.parquet
  text_column: sentence
  label_column: label
  test_source:                       # GLUE 版は test のラベルが非公開のため，原 SST の文レベル test (1,821 文, ラベル付き) を使う
    hf_repo: SetFit/sst2
    file: test.jsonl
    text_column: text
    label_column: label
  max_len: 40                        # 系列長（切り詰め・右パディング）．test の最長は 56 語，平均 19 語
  vocab_size: 5000                   # <pad>, <unk> を含む
  num_classes: 2

model:
  embed_dim: 32
  target_params: 300000              # A1/A2/A3 の総パラメータ数を ±5% で揃える基準値（埋め込みを含む）
  tolerance_pct: 5.0

day1:
  pretrain:
    seed_select: median              # 配布重み = test 精度が中央値のシード（全アーキ共通）
    epochs: 6                        # dev 精度が最良のエポックの重みを配布する（全アーキ共通の手順）
    lr: 0.002
    weight_decay: 0.01
    batch_size: 128
  weights_url: ""                    # 教員が配布する重みの URL．空なら assets/weights/ に手動配置

limits:
  memory_cap_gb: 11.0
  exercise_max_sec: 900
